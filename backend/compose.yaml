services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=smartnotes'
      - 'POSTGRES_USER=root'
      - 'POSTGRES_HOST_AUTH_METHOD=trust'
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d smartnotes"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartnotes-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartnotes'
      - 'SPRING_DATASOURCE_USERNAME=root'
      - 'SPRING_DATASOURCE_PASSWORD='
    networks:
      - smartnotes-network

networks:
  smartnotes-network:
    driver: bridge
