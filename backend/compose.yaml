services:
  # If you ever see "role does not exist" errors, run:
  #   docker compose down -v
  # This resets the Postgres data volume so env vars re-apply.
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=smartnotes'
      - 'POSTGRES_USER=root'
      - 'POSTGRES_HOST_AUTH_METHOD=trust'
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d smartnotes"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartnotes-network

  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartnotes-network
  redis-rate-limiter:
    image: 'redis:latest'
    ports:
      - '6380:6379'
    labels:
      org.springframework.boot.service-connection: "false"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartnotes-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartnotes'
      - 'SPRING_DATASOURCE_USERNAME=root'
      - 'SPRING_DATASOURCE_PASSWORD='
      - 'SPRING_DATA_REDIS_HOST=redis'
      - 'SPRING_DATA_REDIS_PORT=6379'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartnotes-network

networks:
  smartnotes-network:
    driver: bridge